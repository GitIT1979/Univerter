name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Синтаксис JS
        run: |
          git ls-files '*.js' | while read -r f; do node --check "$f"; done

      - name: Синтаксис Python
        run: python -m py_compile $(git ls-files '*.py')

      # Ловит повторные объявления между скриптами, порядок подключения,
      # расхождение копий интерфейса и внешние скрипты в HTML.
      - name: Загрузка интерфейса без браузера
        run: node tests/load-app.js

      # Origin, Sec-Fetch-Site, структурная проверка входных файлов.
      - name: Правила доступа локального движка
        run: python tests/test_server_origin.py
